Localization
{
    en-us
    {
        // 9M33 Osa
        #KAD_9M33_title = 9M33 "Wasp-M" Surface-to-Air Missile
        #KAD_9M33_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M33_description = Authentic replica of the Soviet 9M33 field air defense missile. Features radio command guidance, requiring continuous tracking from the launch vehicle or radar station. Equipped with the latest aerodynamic control system and high-sensitivity proximity fuze.
        #KAD_P40_SEARCH_title = P40 Search Radar
        #KAD_P40_SEARCH_description = The P40 search radar (NATO: Flat Face) for the 9K33 Osa-M air defense system. E-band (2-3GHz) search radar with 30km range, capable of simultaneous search and tracking for command-guided missile engagement.

        // RP-25M High Lark
        #KAD_RP25M_title = RP-25M "High Lark" Fire Control Radar
        #KAD_RP25M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP25M_description = The fire control radar of the MiG-25PD interceptor. J-band single-target pulse radar with twist-Cassegrain antenna, scanning ±60° horizontally and 15° vertically. Detection range of about 100km against bomber-sized targets and 50km against fighters at high altitude head-on, with a maximum tracking range of 80km and rudimentary look-down capability. Provides continuous-wave (CW) illumination for the R-40RD semi-active radar homing missile.

        // FIM-92 Stinger
        #KAD_FIM92_title = FIM-92 "Stinger" MANPADS
        #KAD_FIM92_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_FIM92_description = The classic American man-portable air-defense system. Features passive IR/UV dual-mode seeker with all-aspect engagement capability, shoot-and-forget operation. Ideal for engaging low-altitude helicopters, UAVs, and slow fixed-wing aircraft.

        // IRIS-T SLM
        #KAD_IRIST_SLM_title = IRIS-T SLM Medium-Range SAM
        #KAD_IRIST_SLM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_SLM_description = Advanced German medium-range surface-to-air missile developed by Diehl Defence, adapted from the IRIS-T AAM with a booster stage. Features IIR seeker with datalink mid-course guidance, exceptional ECM resistance, and high maneuverability. Suitable against fighters, cruise missiles, UAVs, and helicopters. Max range 40km, ceiling 20km.

        // IRIST SLS
        #KAD_IRIST_title = IRIS-T SLS Short-Range SAM
        #KAD_IRIST_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_description = A land-based air defense missile based on a simple modification of the IRIS-T air-to-air missile, it employs an infrared imaging (IIR) seeker and thrust vector control, and possesses a 50G extreme maneuverability capability. It is used to intercept aircraft, helicopters, and cruise missiles.

        // I-Derby ER
        #KAD_IDERBYER_title = I-Derby ER Active Radar SAM
        #KAD_IDERBYER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IDERBYER_description = Israeli extended-range active radar homing missile developed by Rafael. Features a dual-pulse rocket motor, software-defined active radar seeker, and data-link mid-course guidance. Used by the SPYDER air defense system. Capable against fighters, UAVs, cruise missiles, and helicopters at ranges up to 40km.

        // MIM-104 Patriot
        #KAD_MIM104_title = MIM-104 "Patriot" Long-Range SAM
        #KAD_MIM104_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MIM104_description = American long-range air defense missile system developed by Raytheon. Uses Track-Via-Missile (TVM) guidance combining command and semi-active radar homing, requiring continuous ground radar illumination. Armed with a 90kg blast-fragmentation warhead. Max range 160km, ceiling 24km. Capable against aircraft, cruise missiles, and ballistic missiles.

        // S-300PS 5V55
        #KAD_S300PS_title = S-300PS 5V55 Long-Range SAM
        #KAD_S300PS_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_S300PS_description = Soviet long-range air defense missile developed by Almaz Central Design Bureau, the standard interceptor of the S-300PS system. Features command guidance with TVM, no active seeker. Armed with a 130kg blast-fragmentation warhead. Max range 90km. Vertical launch capable, with multi-target engagement capability.

        // 9K79 Tochka
        #KAD_9K79_title = 9K79 "Tochka" Tactical Ballistic Missile
        #KAD_9K79_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K79_description = Soviet tactical ballistic missile system (NATO: SS-21 Scarab). Features inertial navigation for engaging fixed ground targets. Armed with an approximately 480kg high-explosive warhead. Range 120km. Solid rocket motor. Surface-to-surface role, not for air defense.

        // 9K34 Strela-3
        #KAD_9K34_title = 9K34 "Strela-3" MANPADS
        #KAD_9K34_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K34_description = Soviet second-generation man-portable air defense system (NATO: SA-14 Gremlin / SA-N-8). Features a cooled IR seeker providing significantly improved head-on engagement capability and ECM resistance over the earlier SA-7. Range 4.5km. Effective against low-altitude aircraft and helicopters.

        // Rapier
        #KAD_RAPIER_title = Rapier Short-Range SAM
        #KAD_RAPIER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RAPIER_description = British short-range air defense missile system developed by BAC (now MBDA). Uses SACLOS radio command guidance, relying on ground tracking radar. Armed with a 1.4kg HE warhead. Range 8.5km. Known for its accuracy and reliability in point defense.

        // Type 81 Tan-SAM
        #KAD_TYPE81_title = Type 81 Tan-SAM (C Standard)
        #KAD_TYPE81_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TYPE81_description = Japanese short-range air defense missile system developed by Toshiba. The C Standard variant features an improved IR seeker with all-aspect engagement capability and enhanced ECCM. Mach 2.9 speed, 40G maneuverability, range up to 14km.

        // 302 ATGM
        #KAD_302_title = Type 302 Anti-Tank Missile
        #KAD_302_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_302_description = Chinese first-generation SACLOS wire-guided anti-tank missile developed in the 1970s, part of Project 122 and predecessor of the HJ-8. 120mm caliber with HEAT warhead. Max range 3km. Designed for engaging ground armored targets.

        // P-6 Shaddock
        #KAD_P6_SHADDOCK_title = P-6 "Shaddock" Anti-Ship Cruise Missile
        #KAD_P6_SHADDOCK_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_P6_SHADDOCK_description = Soviet subsonic anti-ship cruise missile (NATO: SS-N-3b Shaddock) developed by Chelomey Design Bureau. Features a turbojet sustainer with solid rocket booster launch. Inertial guidance with terminal active radar homing. Length 10.8m, diameter 1m, launch mass 5,300kg (incl. booster), 1,000kg semi-armor-piercing warhead. Capable of sea-skimming at 10m altitude in terminal phase. Max range 400km.

        // AGM-84D Harpoon
        #KAD_AGM84D_title = AGM-84D "Harpoon" Anti-Ship Missile
        #KAD_AGM84D_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM84D_description = American all-weather subsonic anti-ship missile developed by Boeing. Features a turbojet sustainer with solid rocket booster. Inertial navigation with terminal active radar homing. Length 4.64m, diameter 340mm, launch mass 690kg, 221kg semi-armor-piercing warhead. Cruise altitude 50m, terminal sea-skimming at 8m. Max range 130km.

        // CM-102 Anti-Radiation
        #KAD_CM102_title = CM-102 Anti-Radiation Missile
        #KAD_CM102_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM102_description = Chinese supersonic anti-radiation missile developed by CASIC. Features a wideband passive seeker (2-18GHz) covering most radar bands. Dual-pulse solid rocket motor. Length ~4.0m, diameter 255mm, launch mass 600kg, 80kg blast-fragmentation warhead. Speed Mach 4+, range 100km. Designed for Suppression of Enemy Air Defenses (SEAD).

        // Kh-25MPU Anti-Radiation
        #KAD_KH25MPU_title = Kh-25MPU Anti-Radiation Missile
        #KAD_KH25MPU_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH25MPU_description = Soviet supersonic anti-radiation missile (NATO: AS-12 Kegler) developed by Zvezda-Strela. Features a dual-pulse solid rocket motor with twin side-mounted nozzles. Passive anti-radiation seeker. Length 4.19m, diameter 275mm, launch mass 320kg, 90kg blast-fragmentation warhead. Speed Mach 2.5-3, range 25-40km. Designed for SEAD missions, targeting enemy radar emissions.

        // Kh-58U Anti-Radiation
        #KAD_KH58U_title = Kh-58U Anti-Radiation Missile
        #KAD_KH58U_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH58U_description = Soviet long-range supersonic anti-radiation missile (NATO: AS-11 Kilter) developed by MKB Raduga. Features a high-thrust solid rocket motor with a wideband passive anti-radiation seeker. Length 4.8m, diameter 380mm, launch mass 640kg, 149kg blast-fragmentation warhead. Speed Mach 3-4, range 250km. One of the largest Soviet air-launched anti-radiation missiles.

        // AGM-88 HARM
        #KAD_AGM88_title = AGM-88 HARM Anti-Radiation Missile
        #KAD_AGM88_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM88_description = American high-speed anti-radiation missile developed by Texas Instruments (now Raytheon). Features a wideband passive seeker covering most radar bands with INS/GPS backup navigation. Dual-thrust solid rocket motor. Length 4.17m, diameter 254mm, launch mass 361kg, 66kg blast-fragmentation warhead. Speed Mach 2+, range 150km. The primary SEAD weapon of the US military.

        // Sea Eagle
        #KAD_SEAEAGLE_title = MBDA "Sea Eagle" Anti-Ship Missile
        #KAD_SEAEAGLE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SEAEAGLE_description = British subsonic anti-ship missile developed by BAe Dynamics (now MBDA). Features a Microturbo TRI-60 turbojet, inertial navigation with terminal active radar homing. Length 4.14m, diameter 400mm, launch mass 600kg, 230kg semi-armor-piercing warhead. Cruise altitude 30m, terminal sea-skimming at 5m. Max range 110km.

        // Tiny Tim
        #KAD_TINYTIM_title = "Tiny Tim" Air-to-Ground Rocket
        #KAD_TINYTIM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TINYTIM_description = American large-caliber unguided rocket developed during WWII by the US Navy. 298mm (11.75in) solid rocket motor with a 60kg shaped-charge warhead. Used by fighter-bombers for anti-ship and ground attack. Fires in a ballistic trajectory after a short 0.5-second burn. Max range ~1,500m.

        // YJ-83K
        #KAD_YJ83K_title = YJ-83K Anti-Ship Missile
        #KAD_YJ83K_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_YJ83K_description = Chinese subsonic anti-ship cruise missile developed by CASIC (C-803 family). Turbojet sustainer with solid rocket booster. Features inertial/GPS navigation with terminal active radar homing. Length 6.39m, diameter 360mm, launch mass 850kg (with booster), 165kg semi-armor-piercing warhead. Mach 0.9 cruise with terminal sea-skimming at 8m. Max range 250km.

        // RW61 380mm
        #KAD_RW61_title = 38cm RW61 Demolition Rocket
        #KAD_RW61_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RW61_description = German WWII 380mm unguided demolition rocket used by the Sturmtiger assault vehicle. Short-burn solid rocket motor, 125kg high-explosive warhead. Fires in a ballistic trajectory. Range ~4,000m. Designed for urban demolition and destroying fortified structures.

        // AGM-65G Maverick
        #KAD_AGM65G_title = AGM-65G "Maverick" Air-to-Ground Missile
        #KAD_AGM65G_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM65G_description = American air-to-ground missile developed by Raytheon. The G variant features an IIR (Imaging Infrared) seeker with a heavyweight 136kg penetrating blast-fragmentation warhead optimized for hardened targets. Solid rocket motor. Length 2.49m, diameter 305mm, launch mass 300kg. Speed Mach 1.2-1.5, range 22km.

        // CM-502KG
        #KAD_CM502KG_title = CM-502KG Air-to-Ground Missile
        #KAD_CM502KG_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM502KG_description = Chinese lightweight precision air-to-ground missile developed by CASIC. Features an IIR seeker with data-link for man-in-the-loop guidance. Solid rocket motor. Length ~2.0m, diameter 180mm, launch mass 100kg, 30kg blast-fragmentation warhead. Designed for strikes against vehicles, bunkers, and light infrastructure.

        // AGM-179 JAGM
        #KAD_AGM179_title = AGM-179 JAGM-MR Air-to-Ground Missile
        #KAD_AGM179_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM179_description = American next-generation air-to-ground missile developed by Lockheed Martin. The JAGM-MR (Medium Range) variant features a tri-mode seeker (SAL + IIR + MMW radar) for all-weather precision strike capability. Dual-pulse solid rocket motor. Length 1.8m, diameter 180mm, launch mass 49kg, 8kg tandem shaped charge warhead. Max range 8km.

        // BA-11A
        #KAD_BA11A_title = BA-11A "Blue Arrow 11A" Air-to-Ground Missile
        #KAD_BA11A_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BA11A_description = Chinese helicopter-launched air-to-ground missile developed by CSGC, comparable to the AGM-114R Hellfire II. Features an IIR (Imaging Infrared) seeker with fire-and-forget capability, plus lock-on-after-launch. Solid rocket motor. Length ~1.8m, diameter 170mm, launch mass 50kg, 10kg tandem shaped charge anti-tank warhead. Max range 10km.

        // Spike LR II
        #KAD_SPIKELR2_title = Spike LR II Anti-Tank Guided Missile
        #KAD_SPIKELR2_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SPIKELR2_description = Israeli multi-role anti-tank missile developed by Rafael. Features an IIR seeker with fiber-optic data link for man-in-the-loop guidance (fire-and-update). Dual-thrust solid rocket motor. Length ~1.2m, diameter 110mm, launch mass 13kg, 8kg tandem shaped charge warhead. Max range 5.5km. Supports direct attack and top-attack profiles.

        // Brimstone
        #KAD_BRIMSTONE_title = Brimstone Air-to-Ground Missile
        #KAD_BRIMSTONE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BRIMSTONE_description = British air-to-ground missile developed by MBDA UK, designed as a Hellfire replacement. Features a dual-mode seeker (MMW radar + SAL laser) for fire-and-forget capability against moving targets. Dual-thrust solid rocket motor. Length ~1.8m, diameter 178mm, launch mass 49kg, 6.3kg tandem shaped charge warhead. Max range 20km, 25G maneuverability.

        // Mistral
        #KAD_MISTRAL_title = Mistral Short-Range SAM
        #KAD_MISTRAL_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MISTRAL_description = French short-range man-portable air defense system developed by MBDA. Features a passive IR seeker with all-aspect engagement and fire-and-forget capability. Solid rocket motor. Length 1.86m, diameter 90mm, launch mass 20kg, 3kg tungsten-ball blast-fragmentation warhead. Speed Mach 2.5, max range 6km, ceiling 3km. Designed against low-altitude aircraft, helicopters, and cruise missiles.

        // 9M38 Buk
        #KAD_9M38_title = 9M38 "Buk" Medium-Range SAM
        #KAD_9M38_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M38_description = Soviet medium-range surface-to-air missile used by the 9K37 Buk system (NATO: SA-11 Gadfly). Features SARH (Semi-Active Radar Homing) requiring continuous radar illumination from the launch vehicle. Dual-pulse solid rocket motor. Length 5.55m, diameter 400mm, launch mass 690kg, 70kg blast-fragmentation warhead. Speed Mach 3-4, max range 30km, ceiling 14km. Capable against aircraft, helicopters, and cruise missiles.

        // 9M37M Strela-10
        #KAD_9M37M_title = 9M37M "Strela-10" Short-Range SAM
        #KAD_9M37M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M37M_description = Soviet short-range surface-to-air missile used by the 9K35 Strela-10 system (NATO: SA-13 Gopher). Features a dual-channel cooled IR seeker with all-aspect engagement and ECCM capability. Solid rocket motor. Length 2.22m, diameter 120mm, launch mass 42kg, 3.5kg blast-fragmentation warhead. Speed Mach 1.8-2, max range 5km, ceiling 3.5km. Vehicle-mounted, four ready-to-launch.

        // PL-5EII
        #KAD_PL5EII_title = PL-5EII Short-Range AAM
        #KAD_PL5EII_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_PL5EII_description = Chinese third-generation short-range IR-guided air-to-air missile, deep upgrade of the PL-5 family. Features an all-aspect IR seeker with high off-boresight capability and improved ECCM. Dual-thrust solid rocket motor. Length 2.92m, diameter 127mm, launch mass 85kg, 6.5kg blast-fragmentation warhead. Max speed Mach 2.5, range 18km.

        // PL-15
        #KAD_PL15_title = PL-15 Long-Range AAM
        #KAD_PL15_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_PL15_description = Chinese fourth-generation long-range active radar-guided air-to-air missile, comparable to the AIM-120D. Features inertial navigation with data-link mid-course correction and active radar terminal homing. Dual-pulse solid rocket motor. Length 3.9m, diameter 203mm, launch mass 200kg, 22kg blast-fragmentation warhead. Speed Mach 4-5, range 150km+.

        // Super 530D
        #KAD_SUPER530D_title = Super 530D Medium-Range AAM
        #KAD_SUPER530D_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SUPER530D_description = French supersonic medium-range semi-active radar homing (SARH) air-to-air missile developed by Matra, used by the Mirage 2000 fighter. Requires continuous radar illumination from the launch aircraft. Solid rocket motor. Length 3.54m, diameter 263mm, launch mass 270kg, 30kg blast-fragmentation warhead. Speed Mach 4.5, range 40km.

        // Red Top
        #KAD_REDTOP_title = "Red Top" Short-Range AAM
        #KAD_REDTOP_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_REDTOP_description = British first-generation IR-guided air-to-air missile developed by Hawker Siddeley, upgrade of the Firestreak missile. Features a passive IR seeker designed primarily for rear-aspect engagement, with limited all-aspect at short range. Solid rocket motor. Length 3.27m, diameter 222mm, launch mass 136kg, 31kg blast-fragmentation warhead. Speed Mach 3, range 12km. Used by the English Electric Lightning.

        // Sky Flash Super TEMP
        #KAD_SKYFLASH_title = "Sky Flash" Super TEMP Medium-Range AAM
        #KAD_SKYFLASH_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SKYFLASH_description = British supersonic medium-range semi-active radar homing (SARH) air-to-air missile developed by Marconi, derived from the AIM-7E Sparrow with a British monopulse seeker and improved ECCM. The Super TEMP variant features enhanced low-altitude performance. Requires continuous radar illumination from the launch aircraft. Length 3.66m, diameter 203mm, launch mass 195kg, 30kg blast-fragmentation warhead. Speed Mach 4, range 45km.

        // R-40
        #KAD_R40_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_R40RD_title = R-40RD "Acrid" Medium-Range SARH AAM
        #KAD_R40RD_description = Soviet/Russian long-range semi-active radar homing air-to-air missile developed by Vympel (NATO: AA-6 Acrid), designed for the MiG-25 interceptor. The RD variant features a continuous-wave SARH seeker with inverse monopulse (ECCM capable) reception and IOG mid-course inertial guidance. The R-40 is one of the largest AAMs ever fielded, with a massive 55kg blast-fragmentation warhead. Solid rocket motor. Length 6.23m, diameter 300mm, launch mass 471kg, 55kg blast-fragmentation warhead. Speed Mach 4-5, range 50km. Capable against high-speed bomber and reconnaissance aircraft. Equipped with both radio and optical proximity fuzes for reliable intercept of high-speed targets.

        #KAD_R40TD_title = R-40TD "Acrid" Medium-Range IR AAM
        #KAD_R40TD_description = Soviet/Russian long-range infrared-homing air-to-air missile developed by Vympel (NATO: AA-6 Acrid), designed for the MiG-25 interceptor. The TD variant features an all-aspect IR seeker with improved IRCCM flare resistance. Solid rocket motor. Length 5.93m, diameter 300mm, launch mass 471kg, 55kg blast-fragmentation warhead. Speed Mach 4-5, range 50km. Capable against high-speed bomber and reconnaissance aircraft. Equipped with both radio and optical proximity fuzes for reliable intercept of high-speed targets.

        #KAD_R40R_title = R-40R "Acrid" Medium-Range SARH AAM
        #KAD_R40R_description = Early variant of the Soviet/Russian long-range semi-active radar homing air-to-air missile developed by Vympel (NATO: AA-6 Acrid), designed for the MiG-25 interceptor. The R variant features a continuous-wave SARH seeker with inverse monopulse (ECCM capable) reception and IOG mid-course inertial guidance. The R-40 is one of the largest AAMs ever fielded, with a massive 38kg blast-fragmentation warhead. Solid rocket motor. Length 6.29m, diameter 300mm, launch mass 469kg, 38kg blast-fragmentation warhead. Speed Mach 4-5, range 50km. Capable against high-speed bomber and reconnaissance aircraft. Equipped with both radio and optical proximity fuzes for reliable intercept of high-speed targets.

        #KAD_R40T_title = R-40T "Acrid" Medium-Range IR AAM
        #KAD_R40T_description = Early variant of the Soviet/Russian long-range infrared-homing air-to-air missile developed by Vympel (NATO: AA-6 Acrid), designed for the MiG-25 interceptor. The T variant features an all-aspect IR seeker. Solid rocket motor. Length 5.90m, diameter 300mm, launch mass 469kg, 38kg blast-fragmentation warhead. Speed Mach 4-5, range 50km. Capable against high-speed bomber and reconnaissance aircraft. Equipped with both radio and optical proximity fuzes for reliable intercept of high-speed targets.

        // R-73
        #KAD_R73_title = R-73 "Archer" Short-Range AAM
        #KAD_R73_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_R73_description = Soviet/Russian fourth-generation short-range IR-guided air-to-air missile developed by Vympel (NATO: AA-11 Archer). Features an all-aspect IR seeker with thrust vector control (TVC), enabling 60° off-boresight engagement when paired with helmet-mounted cueing. Dual-thrust solid rocket motor. Length 2.9m, diameter 170mm, launch mass 105kg, 7.4kg blast-fragmentation warhead. Speed Mach 2.5, range 25km, 40G maneuverability.

        // Mk 83
        #KAD_MK83_title = Mk 83 1,000lb GP Bomb
        #KAD_MK83_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MK83_description = American 1,000lb (460kg) general-purpose aircraft bomb from the Mk 80 series. The Mk 83 carries ~205kg of Tritonal high explosive with a steel casing. Unguided free-fall bomb with a standard ballistic trajectory. Length ~3.0m, diameter 356mm. Suitable against buildings, ships, and ground targets.

        // R-60
        #KAD_R60_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_R60K_title = R-60K "Aphid" Short-Range IR AAM
        #KAD_R60K_description = An ultra-lightweight short-range dogfighting infrared-guided air-to-air missile developed by Vympel (USSR/Russia), NATO reporting name AA-8 Aphid. Designed specifically for close-in high-maneuverability air combat, it is among the lightest mass-produced AAMs in the world. This variant is equipped with a radio proximity fuze. Length 2.09 m, diameter 120 mm, launch mass 43.5 kg. A later upgrade (R-60M) adds limited all-aspect engagement capability and improved IRCCM flare resistance.
        #KAD_R60MK_title = R-60MK "Aphid" Short-Range IR AAM
        #KAD_R60MK_description = An improved variant of the R-60 series short-range infrared-guided air-to-air missile developed by Vympel (USSR/Russia), NATO reporting name AA-8 Aphid. This variant is equipped with a radio proximity fuze. Length 2.13 m, diameter 120 mm, launch mass 45 kg. Upgraded from the base R-60 with an all-aspect infrared seeker, providing limited all-aspect engagement capability and improved IRCCM flare resistance. Widely deployed on MiG-21, MiG-23, MiG-25, Su-15 and other fighters, serving as the standard short-range dogfighting weapon of Warsaw Pact forces.
    }
}
