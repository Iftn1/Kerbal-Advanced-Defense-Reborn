Localization
{
    zh-cn
    {
        // 9M33 Osa
        #KAD_9M33_title = 9M33 “黄蜂-M” 地空导弹
        #KAD_9M33_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M33_description = 苏联9M33野战防空导弹的真实复制品.采用无线电指令制导,需要发射车或雷达站持续跟踪.配备最新气动控制系统和高灵敏度近炸引信.
        #KAD_P40_SEARCH_title = P40 搜索雷达
        #KAD_P40_SEARCH_description = 用于9K33 Osa-M防空系统的P40搜索雷达(北约代号:Flat Face).E波段(2-3GHz)搜索雷达,作用距离30公里,能够同时进行搜索和跟踪,以支持指令制导导弹交战.

        // RP-22SM Jay Bird
        #KAD_RP22SM_title = RP-22SM “松鸦鸟” 火控雷达
        #KAD_RP22SM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP22SM_description = MiG-21Bis战斗机的火控雷达.J波段单目标脉冲雷达,水平扫描±30°,垂直20°.高空迎面探测距离:轰炸机类目标约30公里,战斗机类约16公里,最大跟踪距离15公里,无下视能力.为R-3R半主动雷达制导导弹提供脉冲照射.

        // RP-21M Spin Scan-B
        #KAD_RP21M_title = RP-21M “旋扫-B” 火控雷达
        #KAD_RP21M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP21M_description = MiG-21PFM截击机的火控雷达.J波段单目标脉冲雷达,水平扫描±30°,垂直20°.高空迎面探测距离:轰炸机类目标约20公里,战斗机类约12公里,最大跟踪距离10公里,无下视能力.为R-3R半主动雷达制导导弹提供脉冲照射.

        // RP-25 High Lark
        #KAD_RP25_title = RP-25 “狐火” 火控雷达
        #KAD_RP25_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP25_description = MiG-25P截击机的火控雷达.J波段单目标脉冲雷达,带逆卡塞格伦天线,峰值工作功率600KW,水平扫描±60°,垂直11.6°.高空迎面探测距离:轰炸机类目标约90公里,战斗机类约40公里,最大跟踪距离50公里,具备初级的有限下视能力.为R-40R半主动雷达制导导弹提供连续波(CW)照射.

        // RP-25M High Lark
        #KAD_RP25M_title = RP-25M “高云雀” 火控雷达
        #KAD_RP25M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP25M_description = MiG-25PD截击机的火控雷达.J波段单目标脉冲雷达,带扭曲卡塞格伦天线,水平扫描±60°,垂直15°.高空迎面探测距离:轰炸机类目标约100公里,战斗机类约50公里,最大跟踪距离80公里,具备基础的下视能力.为R-40RD半主动雷达制导导弹提供连续波(CW)照射.

        // FIM-92 Stinger
        #KAD_FIM92_title = FIM-92 “毒刺” 单兵便携式防空导弹
        #KAD_FIM92_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_FIM92_description = 经典的美军单兵便携式防空系统.采用被动红外/紫外双模导引头,具备全向攻击能力,发射后不管.非常适合拦截低空直升机、无人机和慢速固定翼飞机.

        // IRIS-T SLM
        #KAD_IRIST_SLM_title = IRIS-T SLM 中程地空导弹
        #KAD_IRIST_SLM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_SLM_description = 由迪尔防务研发的先进德国中程地空导弹,在IRIS-T空空导弹基础上增加助推级.采用IIR导引头,带数据链中段制导,具备出色的抗干扰能力和高机动性.适用于战斗机、巡航导弹、无人机和直升机.最大射程40公里,射高20公里.

        // IRIST SLS
        #KAD_IRIST_title = IRIS-T SLS 近程地空导弹
        #KAD_IRIST_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_description = 基于IRIS-T空空导弹简易改装而来的陆基防空导弹,采用红外成像(IIR)导引头和推力矢量控制,具备50G极端机动能力.用于拦截飞机、直升机和巡航导弹.

        // I-Derby ER
        #KAD_IDERBYER_title = I-Derby ER 主动雷达地空导弹
        #KAD_IDERBYER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IDERBYER_description = 由拉斐尔研发的以色列增程型主动雷达制导导弹.采用双脉冲火箭发动机、软件定义主动雷达导引头和数据链中段制导.用于SPYDER防空系统.能够对抗战斗机、无人机、巡航导弹和直升机,射程可达40公里.

        // MIM-104 Patriot
        #KAD_MIM104_title = MIM-104 “爱国者” 远程地空导弹
        #KAD_MIM104_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MIM104_description = 由雷神公司研发的美军远程防空导弹系统.采用“通过导弹跟踪”(TVM)制导方式,结合指令制导和半主动雷达寻的,需要地面雷达持续照射.配备90公斤破片杀伤战斗部.最大射程160公里,射高24公里.能够对抗飞机、巡航导弹和弹道导弹.

        // S-300PS 5V55
        #KAD_S300PS_title = S-300PS 5V55 远程地空导弹
        #KAD_S300PS_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_S300PS_description = 由阿尔马兹中央设计局研发的苏联远程防空导弹,是S-300PS系统的标准拦截弹.采用TVM指令制导,无主动导引头.配备130公斤破片杀伤战斗部.最大射程90公里.具备垂直发射能力,可多目标接战.

        // 9K79 Tochka
        #KAD_9K79_title = 9K79 “圆点” 战术弹道导弹
        #KAD_9K79_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K79_description = 苏联战术弹道导弹系统(北约代号:SS-21 Scarab).采用惯性导航,用于打击固定地面目标.配备约480公斤高爆战斗部.射程120公里.固体火箭发动机.地对地角色,非防空用途.

        // 9K34 Strela-3
        #KAD_9K34_title = 9K34 “箭-3” 单兵便携式防空导弹
        #KAD_9K34_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K34_description = 苏联第二代单兵便携式防空系统(北约代号:SA-14 Gremlin / SA-N-8).采用冷却式红外导引头,相比早期SA-7显著提升了迎头攻击能力和抗干扰性.射程4.5公里.有效打击低空飞机和直升机.

        // Rapier
        #KAD_RAPIER_title = “轻剑” 近程地空导弹
        #KAD_RAPIER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RAPIER_description = 由BAC(现MBDA)研发的英国近程防空导弹系统.采用SACLOS无线电指令制导,依赖地面跟踪雷达.配备1.4公斤高爆战斗部.射程8.5公里.以其点防御的精度和可靠性著称.

        // Type 81 Tan-SAM
        #KAD_TYPE81_title = 81式 “短SAM”(C标准型)
        #KAD_TYPE81_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TYPE81_description = 由东芝研发的日本近程防空导弹系统.C标准型改进了红外导引头,具备全向攻击能力和增强的电子对抗能力.速度2.9马赫,机动性40G,射程可达14公里.

        // 302 ATGM
        #KAD_302_title = 302型 反坦克导弹
        #KAD_302_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_302_description = 中国20世纪70年代研发的第一代SACLOS有线制导反坦克导弹,属于122工程的一部分,是红箭-8的前身.120毫米口径,破甲战斗部.最大射程3公里.用于攻击地面装甲目标.

        // P-6 Shaddock
        #KAD_P6_SHADDOCK_title = P-6 “沙道克” 反舰巡航导弹
        #KAD_P6_SHADDOCK_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_P6_SHADDOCK_description = 由切洛梅设计局研发的苏联亚音速反舰巡航导弹(北约代号:SS-N-3b Shaddock).采用涡轮喷气发动机巡航,固体火箭助推器发射.惯性制导,末端主动雷达寻的.长10.8米,直径1米,发射质量5300公斤(含助推器),1000公斤半穿甲战斗部.末端可进行10米高度掠海飞行.最大射程400公里.

        // AGM-84D Harpoon
        #KAD_AGM84D_title = AGM-84D “鱼叉” 反舰导弹
        #KAD_AGM84D_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM84D_description = 由波音公司研发的美军全天候亚音速反舰导弹.采用涡轮喷气发动机巡航,固体火箭助推器.惯性导航,末端主动雷达寻的.长4.64米,直径340毫米,发射质量690公斤,221公斤半穿甲战斗部.巡航高度50米,末端掠海高度8米.最大射程130公里.

        // CM-102 Anti-Radiation
        #KAD_CM102_title = CM-102 反辐射导弹
        #KAD_CM102_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM102_description = 由航天科工研发的中国超音速反辐射导弹.采用宽频被动导引头(2-18GHz),覆盖大多数雷达频段.双脉冲固体火箭发动机.长约4.0米,直径255毫米,发射质量600公斤,80公斤破片杀伤战斗部.速度4+马赫,射程100公里.用于压制敌方防空系统(SEAD).

        // Kh-25MPU Anti-Radiation
        #KAD_KH25MPU_title = Kh-25MPU 反辐射导弹
        #KAD_KH25MPU_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH25MPU_description = 由星辰-箭公司研发的苏联超音速反辐射导弹(北约代号:AS-12 Kegler).采用双脉冲固体火箭发动机,带双侧面喷管.被动反辐射导引头.长4.19米,直径275毫米,发射质量320公斤,90公斤破片杀伤战斗部.速度2.5-3马赫,射程25-40公里.用于SEAD任务,瞄准敌方雷达辐射源.

        // Kh-58U Anti-Radiation
        #KAD_KH58U_title = Kh-58U 反辐射导弹
        #KAD_KH58U_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH58U_description = 由彩虹设计局研发的苏联远程超音速反辐射导弹(北约代号:AS-11 Kilter).采用大推力固体火箭发动机,宽频被动反辐射导引头.长4.8米,直径380毫米,发射质量640公斤,149公斤破片杀伤战斗部.速度3-4马赫,射程250公里.苏联最大的空射反辐射导弹之一.

        // AGM-88 HARM
        #KAD_AGM88_title = AGM-88 HARM 反辐射导弹
        #KAD_AGM88_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM88_description = 由德州仪器(现雷神)研发的美军高速反辐射导弹.采用宽频被动导引头,覆盖大多数雷达频段,并配备INS/GPS备份导航.双推力固体火箭发动机.长4.17米,直径254毫米,发射质量361公斤,66公斤破片杀伤战斗部.速度2+马赫,射程150公里.美军主要SEAD武器.

        // Sea Eagle
        #KAD_SEAEAGLE_title = MBDA “海鹰” 反舰导弹
        #KAD_SEAEAGLE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SEAEAGLE_description = 由BAe Dynamics(现MBDA)研发的英国亚音速反舰导弹.采用Microturbo TRI-60涡轮喷气发动机,惯性导航,末端主动雷达寻的.长4.14米,直径400毫米,发射质量600公斤,230公斤半穿甲战斗部.巡航高度30米,末端掠海高度5米.最大射程110公里.

        // Tiny Tim
        #KAD_TINYTIM_title = “小蒂姆” 空对地火箭弹
        #KAD_TINYTIM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TINYTIM_description = 美国海军在二战期间研发的大口径非制导火箭弹.298毫米(11.75英寸)固体火箭发动机,配备60公斤聚能破甲战斗部.由战斗轰炸机用于反舰和对地攻击.短时0.5秒燃烧后沿弹道轨迹飞行.最大射程约1500米.

        // YJ-83K
        #KAD_YJ83K_title = YJ-83K 反舰导弹
        #KAD_YJ83K_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_YJ83K_description = 由航天科工研发的中国亚音速反舰巡航导弹(C-803家族).采用涡轮喷气发动机巡航,固体火箭助推器.惯性/GPS导航,末端主动雷达寻的.长6.39米,直径360毫米,发射质量850公斤(含助推器),165公斤半穿甲战斗部.巡航速度0.9马赫,末端掠海高度8米.最大射程250公里.

        // RW61 380mm
        #KAD_RW61_title = 38厘米 RW61 爆破火箭弹
        #KAD_RW61_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RW61_description = 二战德国380毫米非制导爆破火箭弹,用于突击虎自行突击炮.短燃时固体火箭发动机,125公斤高爆战斗部.沿弹道轨迹飞行.射程约4000米.用于城市爆破和摧毁坚固工事.

        // AGM-65G Maverick
        #KAD_AGM65G_title = AGM-65G “小牛” 空对地导弹
        #KAD_AGM65G_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM65G_description = 由雷神公司研发的美军空对地导弹.G型采用IIR(红外成像)导引头,配备136公斤重型侵彻破片杀伤战斗部,针对硬目标优化.固体火箭发动机.长2.49米,直径305毫米,发射质量300公斤.速度1.2-1.5马赫,射程22公里.

        // CM-502KG
        #KAD_CM502KG_title = CM-502KG 空对地导弹
        #KAD_CM502KG_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM502KG_description = 由航天科工研发的中国轻型精确空对地导弹.采用IIR导引头,带数据链,支持人在回路中制导.固体火箭发动机.长约2.0米,直径180毫米,发射质量100公斤,30公斤破片杀伤战斗部.用于打击车辆、掩体和轻型基础设施.

        // AGM-179 JAGM
        #KAD_AGM179_title = AGM-179 JAGM-MR 空对地导弹
        #KAD_AGM179_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM179_description = 由洛克希德·马丁研发的美军下一代空对地导弹.JAGM-MR(中程)型采用三模导引头(SAL + IIR + MMW雷达),具备全天候精确打击能力.双脉冲固体火箭发动机.长1.8米,直径180毫米,发射质量49公斤,8公斤串联聚能破甲战斗部.最大射程8公里.

        // BA-11A
        #KAD_BA11A_title = BA-11A “蓝箭11A” 空对地导弹
        #KAD_BA11A_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BA11A_description = 由中国兵器工业集团研发的直升机载空对地导弹,与AGM-114R地狱火II相当.采用IIR(红外成像)导引头,具备发射后不管和发射后锁定能力.固体火箭发动机.长约1.8米,直径170毫米,发射质量50公斤,10公斤串联聚能破甲反坦克战斗部.最大射程10公里.

        // Spike LR II
        #KAD_SPIKELR2_title = Spike LR II 反坦克导弹
        #KAD_SPIKELR2_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SPIKELR2_description = 由拉斐尔研发的以色列多用途反坦克导弹.采用IIR导引头,带光纤数据链,支持人在回路中制导(发射后更新).双推力固体火箭发动机.长约1.2米,直径110毫米,发射质量13公斤,8公斤串联聚能破甲战斗部.最大射程5.5公里.支持直接攻击和攻顶攻击模式.

        // Brimstone
        #KAD_BRIMSTONE_title = “硫磺石” 空对地导弹
        #KAD_BRIMSTONE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BRIMSTONE_description = 由MBDA英国公司研发的英军空对地导弹,作为地狱火的替代品.采用双模导引头(MMW雷达 + SAL激光),具备对移动目标的发射后不管能力.双推力固体火箭发动机.长约1.8米,直径178毫米,发射质量49公斤,6.3公斤串联聚能破甲战斗部.最大射程20公里,机动性25G.

        // Mistral
        #KAD_MISTRAL_title = “西北风” 近程地空导弹
        #KAD_MISTRAL_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MISTRAL_description = 由MBDA研发的法国近程单兵便携式防空系统.采用被动红外导引头,具备全向攻击和发射后不管能力.固体火箭发动机.长1.86米,直径90毫米,发射质量20公斤,3公斤钨珠破片杀伤战斗部.速度2.5马赫,最大射程6公里,射高3公里.用于对抗低空飞机、直升机和巡航导弹.

        // 9M38 Buk
        #KAD_9M38_title = 9M38 “山毛榉” 中程地空导弹
        #KAD_9M38_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M38_description = 用于9K37山毛榉系统(北约代号:SA-11 Gadfly)的苏联中程地空导弹.采用SARH(半主动雷达寻的),需要发射车持续雷达照射.双脉冲固体火箭发动机.长5.55米,直径400毫米,发射质量690公斤,70公斤破片杀伤战斗部.速度3-4马赫,最大射程30公里,射高14公里.能够对抗飞机、直升机和巡航导弹.

        // 9M37M Strela-10
        #KAD_9M37M_title = 9M37M “箭-10” 近程地空导弹
        #KAD_9M37M_manufacturer = Kerbal Advanced Defense (KAD)
