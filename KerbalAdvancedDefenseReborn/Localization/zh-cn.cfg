Localization
{
    zh-cn
    {
        // 9M33 Osa
        #KAD_9M33_title = 9M33 "黄蜂-M" 地对空导弹
        #KAD_9M33_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M33_description = 考究还原苏联经典的 9M33 野战防空导弹。采用无线电指令制导，需要发射车或雷达站提供持续的追踪引导。配备最新版气动控制系统与高灵敏度近炸引信。
        #KAD_P40_SEARCH_title = P40 搜索雷达
        #KAD_P40_SEARCH_description = 9K33"黄蜂-M"系统的P40搜索雷达（北约代号"Flat Face"）。E波段（2-3GHz）搜索雷达，最大探测距离30km，可同时搜索跟踪多个目标并为导弹提供中段指令制导。

        // RP-25M High Lark
        #KAD_RP25M_title = RP-25M "高鸣鸟" 火控雷达
        #KAD_RP25M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RP25M_description = 米格-25PD截击机的火控雷达是一款J波段单目标脉冲雷达，配备了倒置卡塞格伦天线，其扫描范围为水平±60°、垂直15°。在迎头拦截高空目标时，它对轰炸机大小的目标探测距离约为100公里，对战斗机的探测距离约为50公里；其最大跟踪距离为80公里，并具备初步的下视能力。此外，该雷达还能为 R-40RD 半主动雷达制导导弹提供连续波（CW）照射。

        // FIM-92 Stinger
        #KAD_FIM92_title = FIM-92 "毒刺" 便携式防空导弹
        #KAD_FIM92_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_FIM92_description = 美国经典的肩射红外制导防空导弹。采用被动红外/紫外双色导引头，具备全向攻击能力，射后不理。适合打击低空直升机、无人机和慢速固定翼目标。

        // IRIS-T SLM
        #KAD_IRIST_SLM_title = IRIS-T SLM 中程地空导弹
        #KAD_IRIST_SLM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_SLM_description = 德国Diehl Defence研制的先进中程地空导弹，基于IRIS-T空空导弹加装助推器改造而成。采用红外成像（IIR）导引头+数据链中段指令修正，具备极强的抗干扰能力和高机动性。\n\n适合拦截战斗机、巡航导弹、无人机和直升机。最大射程40km，射高20km。

        // IRIST SLS
        #KAD_IRIST_title = IRIS-T SLS 近程地空导弹
        #KAD_IRIST_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IRIST_description = 基于IRIS-T空空导弹简单改造的陆基防空导弹，采用红外成像（IIR）导引头+推力矢量控制，具备50G极限机动能力。用于拦截飞机、直升机和巡航导弹。

        // I-Derby ER
        #KAD_IDERBYER_title = I-Derby ER 主动雷达中程导弹
        #KAD_IDERBYER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_IDERBYER_description = 以色列拉斐尔公司研制的增程型主动雷达制导导弹，采用双脉冲火箭发动机、软件定义主动雷达导引头和数据链中段制导。用于SPYDER防空系统，可拦截战斗机、无人机、巡航导弹和直升机，最大射程40km。

        // MIM-104 Patriot
        #KAD_MIM104_title = MIM-104 "爱国者" 远程地空导弹
        #KAD_MIM104_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MIM104_description = 美国雷神公司研制的远程防空导弹系统，采用指令+半主动雷达（TVM）制导方式，依赖地面雷达持续照射目标。配备90kg高爆破片战斗部，最大射程160km，射高24km，可拦截飞机、巡航导弹和弹道导弹。

        // S-300PS 5V55
        #KAD_S300PS_title = S-300PS 5V55 远程地空导弹
        #KAD_S300PS_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_S300PS_description = 苏联金刚石中央设计局研制的远程防空导弹，S-300PS系统的标准拦截弹。采用指令制导+TVM，无主动导引头。配备130kg高爆破片战斗部，最大射程90km，采用垂直发射方式，可同时引导多枚导弹拦截多个目标。

        // 9K79 Tochka
        #KAD_9K79_title = 9K79 "圆点" 战术弹道导弹
        #KAD_9K79_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K79_description = 苏联研制的战术弹道导弹系统（北约代号SS-21 Scarab）。采用惯性导航，打击固定地面目标。配备约480kg高爆战斗部，射程120km，固体火箭发动机。属于地对地弹道导弹，不可用于防空。

        // 9K34 Strela-3
        #KAD_9K34_title = 9K34 "箭-3" 便携式防空导弹
        #KAD_9K34_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9K34_description = 苏联第二代单兵便携式防空导弹（北约代号SA-14 Gremlin/SA-N-8）。采用制冷红外导引头，相比SA-7大幅提升迎头攻击能力和抗干扰性能。射程4.5km，可对付低空飞机和直升机。

        // Rapier
        #KAD_RAPIER_title = "轻剑" 近程防空导弹
        #KAD_RAPIER_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RAPIER_description = 英国宇航公司（BAE）研制的近程防空导弹系统。采用SACLOS无线电指令制导，依赖地面跟踪雷达引导。配备1.4kg高爆战斗部，射程8.5km，以高精度和可靠性著称。

        // Type 81 Tan-SAM
        #KAD_TYPE81_title = 81式 短距離防空导弹 (C标准)
        #KAD_TYPE81_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TYPE81_description = 日本东芝公司研制的近程防空导弹系统（Tan-SAM）。C标准型采用改良红外导引头，具备全向攻击能力和更强的抗干扰性能。射程14km，速度Mach 2.9，机动过载40G。

        // 302 ATGM
        #KAD_302_title = 302型 反坦克导弹
        #KAD_302_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_302_description = 中国1970年代研制的第一代SACLOS有线制导反坦克导弹，122工程的一部分，也是红箭-8的前身。120mm口径，HEAT破甲战斗部，最大射程3km，用于攻击地面装甲目标。

        // P-6 Shaddock
        #KAD_P6_SHADDOCK_title = P-6 "沙道克" 反舰巡航导弹
        #KAD_P6_SHADDOCK_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_P6_SHADDOCK_description = 苏联切洛梅设计局研制的亚音速反舰巡航导弹（北约代号SS-N-3b Shaddock）。采用涡喷发动机巡航+固体助推器发射，惯性制导+末端主动雷达寻的。弹长10.8m，弹径1m，发射质量5,300kg（含助推器），战斗部1,000kg半穿甲弹。巡航高度可在末端降至10m掠海飞行，最大射程400km。

        // AGM-84D Harpoon
        #KAD_AGM84D_title = AGM-84D "鱼叉" 反舰导弹
        #KAD_AGM84D_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM84D_description = 美国波音公司研制的全天候亚音速反舰导弹。采用涡喷发动机+固体助推器，惯性导航+末端主动雷达制导。弹长4.64m，弹径340mm，发射质量690kg，战斗部221kg半穿甲弹。低空巡航高度50m，末端降至8m掠海飞行，最大射程130km。

        // CM-102 反辐射导弹
        #KAD_CM102_title = CM-102 反辐射导弹
        #KAD_CM102_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM102_description = 中国航天科工集团研制的超音速反辐射导弹。采用宽带被动导引头（2-18GHz），覆盖绝大多数雷达波段。双脉冲固体火箭发动机，发射后不管。弹长约4.0m，弹径255mm，发射质量600kg，80kg杀伤爆破战斗部。速度Mach 4+，射程100km，用于压制敌方防空系统（SEAD）。

        // Kh-25MPU 反辐射导弹
        #KAD_KH25MPU_title = Kh-25MPU 反辐射导弹
        #KAD_KH25MPU_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH25MPU_description = 苏联Zvezda-Strela公司研制的超音速反辐射导弹（北约代号AS-12 Kegler）。采用双脉冲固体火箭发动机，侧置双喷口布局，被动反辐射导引头。弹长4.19m，弹径275mm，发射质量320kg，90kg杀伤爆破战斗部。速度Mach 2.5-3，射程25-40km。用于压制敌方防空系统，自动追踪雷达辐射源。

        // Kh-58 早期型
        #KAD_KH58_title = Kh-58 反辐射导弹
        #KAD_KH58_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH58_description = 苏联"彩虹"设计局研制的远程超音速反辐射导弹（北约代号AS-11 Kilter）。采用大推力固体火箭发动机，L-111单波段被动反辐射导引头。弹长4.8m，弹径380mm，发射质量640kg，149kg杀伤爆破战斗部。速度Mach 3.6，射程36-120km。

        // Kh-58U 反辐射导弹
        #KAD_KH58U_title = Kh-58U 反辐射导弹
        #KAD_KH58U_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_KH58U_description = 苏联"彩虹"设计局研制的远程超音速反辐射导弹（北约代号AS-11 Kilter）。采用大推力固体火箭发动机，被动宽频反辐射导引头。弹长4.8m，弹径380mm，发射质量640kg，150kg杀伤爆破战斗部。速度Mach 3-4，射程120km，是苏联最大的空射反辐射导弹之一。

        // AGM-88 HARM
        #KAD_AGM88_title = AGM-88 HARM 反辐射导弹
        #KAD_AGM88_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM88_description = 美国德州仪器（现雷神）公司研制的超音速反辐射导弹。采用宽带被动导引头覆盖大部分雷达波段，具备INS/GPS备份导航。双推力固体火箭发动机，弹长4.17m，弹径254mm，发射质量361kg，66kg杀伤爆破战斗部。速度Mach 2+，射程150km，是美国军队主力防空压制（SEAD）武器。

        // Sea Eagle
        #KAD_SEAEAGLE_title = MBDA "海鹰" 反舰导弹
        #KAD_SEAEAGLE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SEAEAGLE_description = 英国BAE动力公司（现MBDA）研制的亚音速反舰导弹。采用Microturbo TRI-60涡喷发动机，惯性导航+末端主动雷达制导。弹长4.14m，弹径400mm，发射质量600kg，230kg半穿甲战斗部。典型巡航高度30m，末端可降至5m掠海飞行，最大射程110km。

        // Tiny Tim
        #KAD_TINYTIM_title = "小蒂姆" 空对地火箭弹
        #KAD_TINYTIM_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_TINYTIM_description = 美国海军二战期间研制的大口径无控空对地/反舰火箭弹。298mm（11.75英寸）固体火箭发动机，配备60kg聚能破甲战斗部。由战斗轰炸机挂载执行对地/对舰攻击。短时0.5秒燃烧后弹道飞行，无制导。最大射程约1,500m。

        // YJ-83K
        #KAD_YJ83K_title = 鹰击-83K 反舰导弹
        #KAD_YJ83K_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_YJ83K_description = 中国航天科工集团研制的亚音速反舰巡航导弹（C-803系列）。采用涡喷发动机+固体助推器，惯性/GPS导航+末端主动雷达制导。弹长6.39m，弹径360mm，发射质量850kg（含助推器），165kg半穿甲战斗部。巡航速度Mach 0.9，末端掠海高度8m，最大射程250km。

        // RW61 380mm
        #KAD_RW61_title = 38cm RW61 攻坚火箭弹
        #KAD_RW61_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_RW61_description = 德国二战380mm无控火箭弹，用于"突击虎"重型突击炮。短时固体火箭发动机，配备125kg高爆战斗部。弹道飞行，无制导。最大射程约4,000m，专门用于城市攻坚和摧毁坚固工事。

        // AGM-65G Maverick
        #KAD_AGM65G_title = AGM-65G "小牛" 空对地导弹
        #KAD_AGM65G_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM65G_description = 美国雷神公司研制的空对地导弹。G型采用红外成像（IIR）导引头，配备136kg重型侵彻爆破战斗部，专门针对加固目标优化。固体火箭发动机，弹长2.49m，弹径305mm，发射质量300kg。速度Mach 1.2-1.5，射程22km。

        // CM-502KG
        #KAD_CM502KG_title = CM-502KG 空对地导弹
        #KAD_CM502KG_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_CM502KG_description = 中国航天科工集团研制的轻量级精确制导空对地导弹。采用红外成像（IIR）导引头+数据链，支持人在回路中制导。固体火箭发动机，弹长约2.0m，弹径180mm，发射质量100kg，30kg杀伤爆破战斗部。用于打击车辆、工事和轻型基础设施。

        // AGM-179 JAGM
        #KAD_AGM179_title = AGM-179 JAGM-MR 空对地导弹
        #KAD_AGM179_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_AGM179_description = 美国洛克希德·马丁公司研制的下一代空对地导弹。JAGM-MR（中程型）采用三模导引头（激光半主动+红外成像+毫米波雷达），具备全天候精确打击能力。双脉冲固体火箭发动机，弹长1.8m，弹径180mm，发射质量49kg，8kg串联聚能战斗部。最大射程8km。

        // BA-11A
        #KAD_BA11A_title = 蓝箭-11A 空对地导弹
        #KAD_BA11A_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BA11A_description = 中国兵器装备集团研制的直升机载空对地导弹，与AGM-114R地狱火II同级。采用红外成像（IIR）导引头，具备射后不理和发射后锁定能力。固体火箭发动机，弹长约1.8m，弹径170mm，发射质量50kg，10kg串联聚能破甲战斗部。最大射程10km，用于打击坦克和坚固工事。

        // Spike LR II
        #KAD_SPIKELR2_title = 长钉-LR II 反坦克导弹
        #KAD_SPIKELR2_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_SPIKELR2_description = 以色列拉斐尔公司研制的多用途反坦克导弹。采用红外成像（IIR）导引头+光纤数据链，支持人在回路（发射后更新目标）制导。双推力固体火箭发动机，弹长1.2m，弹径110mm，发射质量13kg，8kg串联聚能破甲战斗部。最大射程5.5km，支持直接攻击和攻顶两种弹道。

        // Brimstone
        #KAD_BRIMSTONE_title = "硫磺石" 空对地导弹
        #KAD_BRIMSTONE_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_BRIMSTONE_description = 英国MBDA UK公司研制的空对地导弹，作为地狱火的替代而开发。采用双模导引头（毫米波雷达+激光半主动），具备对移动目标的射后不理能力。双推力固体火箭发动机，弹长1.8m，弹径178mm，发射质量49kg，6.3kg串联聚能战斗部。最大射程20km，机动过载25G。

        // Mistral
        #KAD_MISTRAL_title = "西北风" 短程地对空导弹
        #KAD_MISTRAL_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_MISTRAL_description = 法国MBDA公司研制的近程便携式防空导弹。采用被动红外导引头，具备全向攻击和射后不理能力。固体火箭发动机，弹长1.86m，弹径90mm，发射质量20kg，3kg钨球杀伤爆破战斗部。速度Mach 2.5，最大射程6km，射高3km，用于拦截低空飞机、直升机和巡航导弹。

        // 9M38 Buk
        #KAD_9M38_title = 9M38 "山毛榉" 中程防空导弹
        #KAD_9M38_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M38_description = 苏联9K37"山毛榉"系统（北约代号SA-11 Gadfly）的中程防空导弹。采用半主动雷达（SARH）制导，需发射车持续雷达照射。双脉冲固体火箭发动机，弹长5.55m，弹径400mm，发射质量690kg，70kg高爆破片战斗部。速度Mach 3-4，最大射程30km，射高14km。可拦截飞机、直升机和巡航导弹。

        // 9M37M Strela-10
        #KAD_9M37M_title = 9M37M "箭-10" 近程防空导弹
        #KAD_9M37M_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_9M37M_description = 苏联9K35"箭-10"系统（北约代号SA-13 Gopher）的近程防空导弹。采用双通道制冷红外导引头，具备全向攻击和抗干扰能力。固体火箭发动机，弹长2.22m，弹径120mm，发射质量42kg，3.5kg高爆破片战斗部。速度Mach 1.8-2，最大射程5km，射高3.5km。车载发射，四联装待发。

        // PL-5EII
        #KAD_PL5EII_title = 霹雳-5EII 近距空空导弹
        #KAD_PL5EII_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_PL5EII_description = 中国研制的第三代近距红外制导空空导弹，基于霹雳-5系列深度改进。采用全向红外导引头，具备大离轴发射能力和改进的抗干扰性能。双推力固体火箭发动机，弹长2.92m，弹径127mm，发射质量85kg，6.5kg高爆破片战斗部。最大速度Mach 2.5，射程18km。

        // PL-15
        #KAD_PL15_title = 霹雳-15 中远程空空导弹
        #KAD_PL15_manufacturer = Kerbal Advanced Defense (KAD)
        #KAD_PL15_description = 中国研制的第四代主动雷达制导远程空空导弹，与AIM-120D同级。采用惯性导航+数据链中段修正+末端主动雷达制导。双脉冲固体火箭发动机，弹长3.9m，弹径203mm，发射质量200kg，22kg高爆破片战斗部。速度Mach 4-5，射程150km以上。

        // Super 530D
        #KAD_SUPER530D_title = R.550 超530D 中程空空导弹
        #KAD_SUPER530D_manufacturer = Kerbal Advanced Defense (KAD)
